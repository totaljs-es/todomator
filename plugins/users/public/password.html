<ui-component name="miniform" path="*form" config="if:CLASS;title:@(Change password);icon:ti ti-key;autofocus:true;submit:?/submit;width:360;zindex:50" class="hidden CLASS" plugin="CLASS">
	<div class="padding">
		<div class="m"><img src="/img/password.jpg" class="img-responsive" alt="" /></div>
		<div class="m">
			<ui-component name="input" path="?.password" config="required:1;type:password">@(New password)</ui-component>
		</div>
		<div class="m">
			<ui-component name="input" path="?.passwordreply" config="required:1;type:password">@(Reply password)</ui-component>
			<ui-bind path="?" config="track:password,passwordreply;show:value && value.password && value.passwordreply && value.password !== value.passwordreply" class="hidden block">
				<div class="help red"><i class="ti ti-exclamation-triangle mr5"></i>@(Passwords do not match)</div>
			</ui-bind>
		</div>
		<ui-component name="input" path="?.is2fa" config="type:checkbox"><b>@(Enable 2FA authentication)</b></ui-component>
	</div>
	<nav>
		<ui-component name="validate" path="?" config="if:value.password === value.passwordreply">
			<button name="submit" disabled><i class="ti ti-check-circle"></i>@(SUBMIT)</button>
			<button name="cancel">@(Cancel)</button>
		</ui-component>
	</nav>
</ui-component>

<script>

	PLUGIN(function(exports) {

		exports.submit = function(hide) {
			var form = exports.form;
			delete form.passwordreply;
			exports.tapi('Password ERROR', form, function() {
				hide();
				SETTER('notify/success', '@(Your password has been changed successfully)');
			});
		};

	});

</script>
